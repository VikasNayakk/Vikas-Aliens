name: BCE Extension Validation

on:
  push:
    branches:
      - Chatgpt
    paths:
      - "Extensions/BCE/**"
      - ".github/workflows/bce-validation.yml"
  pull_request:
    paths:
      - "Extensions/BCE/**"
      - ".github/workflows/bce-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-extension:
    name: Validate Chrome extension files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find Extensions/BCE -maxdepth 1 -type f -name '*.js' -print0)

      - name: Validate manifest JSON and referenced files
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = path.resolve('Extensions/BCE');
          const manifestPath = path.join(root, 'manifest.json');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));

          if (manifest.manifest_version !== 3) {
            throw new Error('BCE must remain a Manifest V3 extension.');
          }

          const references = [
            manifest.action?.default_popup,
            manifest.options_page,
            manifest.background?.service_worker,
            ...(manifest.content_scripts || []).flatMap(item => item.js || [])
          ].filter(Boolean);

          for (const relativePath of references) {
            const target = path.resolve(root, relativePath);
            if (!target.startsWith(root + path.sep)) {
              throw new Error('Manifest path escapes BCE directory: ' + relativePath);
            }
            if (!fs.existsSync(target) || !fs.statSync(target).isFile()) {
              throw new Error('Manifest references missing file: ' + relativePath);
            }
          }

          console.log('Manifest is valid. Checked ' + references.length + ' referenced file(s).');
          NODE

      - name: Check whitespace errors
        run: git show --check --oneline HEAD
