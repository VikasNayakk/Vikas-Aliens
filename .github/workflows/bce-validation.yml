name: BCE Extension Validation

on:
  push:
    branches:
      - Chatgpt
    paths:
      - "Extensions/BCE/**"
      - ".github/workflows/bce-validation.yml"
  pull_request:
    paths:
      - "Extensions/BCE/**"
      - ".github/workflows/bce-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-extension:
    name: Validate Chrome extension files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run BCE validation
        working-directory: Extensions/BCE
        run: npm run check

      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
